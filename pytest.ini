[pytest]
pythonpath = packages/tooling/src . tests
# The core suite. The OPS extension suite has its own configuration:
# python -m pytest extensions/ops/tests (extensions/ops/pytest.ini).
testpaths = tests
markers =
    image: contract tests against built images (tests/image, tests/install); need Docker and AGENT_TOOLING_TEST_IMAGE*. Excluded by default; select with -m image.
addopts = -m "not image"
