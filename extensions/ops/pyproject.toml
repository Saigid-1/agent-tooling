[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kp-agent-tooling-ops"
version = "0.4.0"
description = "OPS extension for kp-agent-tooling: verification, lifecycle evidence, rationale, knowledge documents and legacy desk tooling"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
# The extension depends on the core at the same version; the core never depends on it.
dependencies = ["kp-agent-tooling==0.4.0", "jsonschema==4.26.0"]

[project.scripts]
kp-agent-observations = "kp_agent_tooling_ops.observation_cli:main"
kp-agent-capture = "kp_agent_tooling_ops.capture_cli:main"
kp-agent-transcript = "kp_agent_tooling_ops.transcript_cli:main"
kp-agent-claude-capture = "kp_agent_tooling_ops.claude_hook_cli:main"
kp-agent-knowledge-publish = "kp_agent_tooling_ops.knowledge_publish_cli:main"

# The navigation server (kp-agent-tooling) discovers tool providers in this group.
[project.entry-points."kp_agent_tooling.tools"]
ops = "kp_agent_tooling_ops._impl.service.ops_tools:OpsToolProvider"

[project.optional-dependencies]
test = ["pytest>=8,<10", "numpy>=2,<3"]
telemetry = ["opentelemetry-sdk==1.44.0", "opentelemetry-exporter-otlp-proto-http==1.44.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kp_agent_tooling_ops = ["assets/*"]
