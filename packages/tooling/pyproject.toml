[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kp-agent-tooling"
version = "0.4.0"
description = "Source navigation, evidence delivery and harness-independent desk memory"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
dependencies = ["jsonschema==4.26.0", "mcp==1.28.1", "PyYAML==6.0.3"]

[project.scripts]
kp-agent-desk-registry = "kp_agent_tooling.desk_registry_cli:main"
kp-agent-desk-setup = "kp_agent_tooling.catalog_cli:main"
kp-agent-host-card = "kp_agent_tooling.host_bridge_cli:main"
kp-agent-refresh = "kp_agent_tooling.refresh_cli:main"
kp-agent-memory-queue = "kp_agent_tooling.queue_cli:main"
kp-agent-summarizer = "kp_agent_tooling._impl.service.summarizer_role:main"
kp-agent-memory = "kp_agent_tooling.memory_cli:main"
kp-agent-models = "kp_agent_tooling.models_cli:main"
kp-agent-desk = "kp_agent_tooling.desk_cli:main"
kp-agent-tooling = "kp_agent_tooling.cli:main"
kp-agent-setup = "kp_agent_tooling.setup_cli:main"
kp-agent-session-import = "kp_agent_tooling.session_import_cli:main"
kp-agent-workspace-capture = "kp_agent_tooling.workspace_capture_cli:main"
kp-agent-install = "kp_agent_tooling.install_cli:main"
kp-agent-launch = "kp_agent_tooling.launch_cli:main"
kp-agent-host = "kp_agent_tooling.host_cli:main"

[project.optional-dependencies]
test = ["pytest>=8,<10", "numpy>=2,<3"]
semantic = ["sentence-transformers>=3,<6"]
telemetry = ["opentelemetry-sdk==1.44.0", "opentelemetry-exporter-otlp-proto-http==1.44.0"]

# Source semantic retrieval is optional; no model download on base installation.

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kp_agent_tooling = ["assets/*", "assets/**/*", "_impl/*.json"]
